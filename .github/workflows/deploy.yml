name: Build and Verify KasirIn POS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore KasirIn.sln

    - name: Build solution
      run: dotnet build KasirIn.sln --no-restore -c Release

    - name: Run unit tests
      run: dotnet test KasirIn.sln --no-build -c Release --verbosity normal
